services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webui_secret}
      POSTGRES_DB: ${POSTGRES_DB:-openwebui}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webui} -d ${POSTGRES_DB:-openwebui}"]
      interval: 5s
      timeout: 5s
      retries: 5

  middleware:
    build: 
      context: .
      dockerfile: src/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.6.5
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-webui}:${POSTGRES_PASSWORD:-webui_secret}@postgres:5432/${POSTGRES_DB:-openwebui}
      OPENAI_API_BASE_URL: http://middleware:8000/v1
      OPENAI_API_KEY: sk-proxy-internal
      ENABLE_OLLAMA_API: "false"
    depends_on:
      postgres:
        condition: service_healthy
      middleware:
        condition: service_healthy
    volumes:
      - webui_data:/app/backend/data

volumes:
  pgdata:
  webui_data: